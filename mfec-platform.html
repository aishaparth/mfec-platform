<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MFEC GeoAI Platform – Meghalaya Farmers' Empowerment Commission</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --forest: #1B4332;
    --jade: #2D6A4F;
    --sage: #40916C;
    --moss: #52B788;
    --mist: #95D5B2;
    --cloud: #D8F3DC;
    --fog: #F0FBF3;
    --stone: #1C1917;
    --slate: #374151;
    --silver: #6B7280;
    --bone: #F9F7F4;
    --cream: #FEFCF8;
    --amber: #D97706;
    --saffron: #F59E0B;
    --rust: #DC2626;
    --gold: #B45309;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--stone);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    background: rgba(27,67,50,0.97);
    backdrop-filter: blur(12px);
    padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px;
    border-bottom: 1px solid rgba(149,213,178,0.2);
  }
  .nav-brand {
    display: flex; align-items: center; gap: 12px;
    font-family: 'Space Mono', monospace;
    color: var(--mist);
    font-size: 13px;
    letter-spacing: 0.05em;
    font-weight: 700;
  }
  .nav-badge {
    background: var(--moss);
    color: white;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.1em;
  }
  .nav-links {
    display: flex; gap: 4px;
  }
  .nav-link {
    color: rgba(149,213,178,0.7);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 4px;
    transition: all 0.2s;
    letter-spacing: 0.02em;
    cursor: pointer;
    border: none; background: none;
  }
  .nav-link:hover, .nav-link.active {
    background: rgba(149,213,178,0.12);
    color: var(--mist);
  }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #0D2B1E 0%, #1B4332 45%, #2D3B2A 100%);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    padding-top: 60px;
  }
  .hero-grid {
    position: absolute; inset: 0; opacity: 0.07;
    background-image:
      linear-gradient(rgba(149,213,178,0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(149,213,178,0.5) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .hero-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
  }
  .hero-orb-1 { width: 600px; height: 600px; top: -100px; right: -100px; background: rgba(64,145,108,0.15); }
  .hero-orb-2 { width: 400px; height: 400px; bottom: 100px; left: -80px; background: rgba(82,183,136,0.1); }

  .hero-content {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 80px 64px 60px;
    position: relative; z-index: 1;
    max-width: 1400px;
  }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--moss);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .hero-eyebrow::before {
    content: '';
    display: block; width: 32px; height: 1px;
    background: var(--moss);
  }
  .hero-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(52px, 6vw, 88px);
    line-height: 0.95;
    color: white;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .hero-title em {
    font-style: italic;
    color: var(--mist);
  }
  .hero-subtitle {
    font-size: 18px;
    color: rgba(149,213,178,0.7);
    margin-top: 24px;
    max-width: 560px;
    line-height: 1.6;
    font-weight: 300;
  }
  .hero-meta {
    display: flex; gap: 32px; margin-top: 48px; flex-wrap: wrap;
  }
  .hero-meta-item {
    display: flex; flex-direction: column; gap: 4px;
  }
  .hero-meta-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--moss);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .hero-meta-value {
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    font-weight: 500;
  }
  .hero-cta {
    display: flex; gap: 16px; margin-top: 40px;
  }
  .btn-primary {
    background: var(--sage);
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.02em;
  }
  .btn-primary:hover { background: var(--jade); transform: translateY(-1px); }
  .btn-outline {
    background: transparent;
    color: var(--mist);
    border: 1px solid rgba(149,213,178,0.4);
    padding: 14px 28px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .btn-outline:hover { border-color: var(--mist); background: rgba(149,213,178,0.05); }

  /* Hero Stats Bar */
  .hero-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid rgba(149,213,178,0.15);
    position: relative; z-index: 1;
  }
  .hero-stat {
    padding: 28px 40px;
    border-right: 1px solid rgba(149,213,178,0.1);
  }
  .hero-stat:last-child { border-right: none; }
  .hero-stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 42px;
    color: var(--mist);
    line-height: 1;
  }
  .hero-stat-label {
    font-size: 12px;
    color: rgba(149,213,178,0.55);
    margin-top: 6px;
    letter-spacing: 0.03em;
  }

  /* ── SECTIONS ── */
  .section {
    padding: 96px 64px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .section-full { max-width: none; padding: 0; }

  .section-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-eyebrow::before {
    content: ''; display: block;
    width: 24px; height: 1px;
    background: var(--sage);
  }
  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(36px, 4vw, 56px);
    line-height: 1.05;
    color: var(--forest);
    margin-bottom: 16px;
  }
  .section-lead {
    font-size: 16px;
    color: var(--silver);
    max-width: 600px;
    line-height: 1.7;
    margin-bottom: 48px;
  }

  /* ── MAPS ── */
  .map-section-bg {
    background: var(--fog);
    border-top: 1px solid var(--cloud);
    border-bottom: 1px solid var(--cloud);
  }
  .map-container-outer {
    padding: 80px 64px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .map-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 24px;
    margin-top: 40px;
  }
  .leaflet-map {
    height: 520px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--cloud);
    box-shadow: 0 4px 24px rgba(27,67,50,0.08);
  }
  .map-sidebar {
    display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto; max-height: 520px;
  }
  .district-card {
    background: white;
    border: 1px solid var(--cloud);
    border-radius: 6px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .district-card:hover, .district-card.selected {
    border-color: var(--sage);
    box-shadow: 0 0 0 2px rgba(64,145,108,0.15);
  }
  .district-card-header {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .district-name { font-weight: 600; font-size: 13px; color: var(--forest); }
  .district-hq { font-size: 11px; color: var(--silver); margin-top: 2px; }
  .suitability-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 2px;
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .badge-high { background: #D1FAE5; color: #065F46; }
  .badge-medium { background: #FEF3C7; color: #92400E; }
  .badge-low { background: #FEE2E2; color: #991B1B; }
  .score-bar { margin-top: 10px; }
  .score-bar-track {
    height: 4px; background: var(--cloud);
    border-radius: 2px; overflow: hidden;
  }
  .score-bar-fill {
    height: 100%; border-radius: 2px;
    transition: width 0.5s ease;
  }
  .score-label { font-size: 10px; color: var(--silver); margin-top: 4px; display: flex; justify-content: space-between; }

  /* Map Tabs */
  .map-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .map-tab {
    padding: 8px 18px;
    border: 1px solid var(--cloud);
    background: white;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--slate);
  }
  .map-tab.active {
    background: var(--forest);
    color: white;
    border-color: var(--forest);
  }

  /* ── DELIVERABLES ── */
  .deliverables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 20px;
    margin-top: 40px;
  }
  .deliverable-card {
    background: white;
    border: 1px solid var(--cloud);
    border-radius: 8px;
    padding: 24px;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .deliverable-card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--sage);
  }
  .deliverable-card:hover {
    box-shadow: 0 8px 32px rgba(27,67,50,0.1);
    transform: translateY(-2px);
  }
  .deliverable-num {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--sage);
    margin-bottom: 10px;
    letter-spacing: 0.1em;
  }
  .deliverable-title {
    font-size: 15px; font-weight: 600;
    color: var(--forest); margin-bottom: 8px;
    line-height: 1.3;
  }
  .deliverable-desc {
    font-size: 13px; color: var(--silver);
    line-height: 1.6; margin-bottom: 14px;
  }
  .deliverable-date {
    font-family: 'Space Mono', monospace;
    font-size: 11px; color: var(--amber);
    background: #FEF3C7;
    padding: 4px 10px;
    border-radius: 3px;
    display: inline-block;
  }
  .deliverable-tags {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;
  }
  .tag {
    font-size: 10px; padding: 3px 8px;
    background: var(--fog);
    color: var(--jade);
    border-radius: 3px;
    border: 1px solid var(--cloud);
    font-weight: 500;
  }
  .deliverable-sources {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--cloud);
  }
  .sources-label {
    font-size: 10px; color: var(--silver);
    text-transform: uppercase; letter-spacing: 0.1em;
    font-family: 'Space Mono', monospace;
    margin-bottom: 6px;
  }
  .source-item {
    font-size: 11px; color: var(--slate);
    padding: 2px 0;
    display: flex; align-items: flex-start; gap: 6px;
  }
  .source-item::before { content: '→'; color: var(--moss); flex-shrink: 0; }

  /* ── CROPS ── */
  .crops-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px; margin-top: 40px;
  }
  .crop-card {
    background: white;
    border: 1px solid var(--cloud);
    border-radius: 10px;
    padding: 28px;
    transition: all 0.25s;
  }
  .crop-card:hover { box-shadow: 0 8px 32px rgba(27,67,50,0.1); }
  .crop-icon { font-size: 36px; margin-bottom: 16px; }
  .crop-name {
    font-family: 'DM Serif Display', serif;
    font-size: 26px; color: var(--forest);
    margin-bottom: 4px;
  }
  .crop-sci { font-style: italic; font-size: 13px; color: var(--silver); margin-bottom: 16px; }
  .crop-attrs {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .crop-attr { }
  .attr-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--silver);
    margin-bottom: 3px;
  }
  .attr-value { font-size: 12px; color: var(--slate); font-weight: 500; }
  .crop-districts { margin-top: 16px; }
  .districts-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .district-chip {
    font-size: 11px; padding: 4px 10px;
    background: var(--cloud); color: var(--jade);
    border-radius: 20px; font-weight: 500;
  }

  /* ── MILESTONE TIMELINE ── */
  .timeline {
    position: relative; padding: 20px 0;
    margin-top: 40px;
  }
  .timeline::before {
    content: '';
    position: absolute; left: 32px; top: 0; bottom: 0;
    width: 2px; background: var(--cloud);
  }
  .milestone-item {
    display: flex; gap: 24px;
    padding: 20px 0; position: relative;
  }
  .milestone-dot {
    width: 20px; height: 20px; min-width: 20px;
    border-radius: 50%;
    background: var(--sage);
    border: 3px solid white;
    box-shadow: 0 0 0 3px var(--cloud);
    margin-top: 4px; z-index: 1;
    position: relative; left: 23px;
  }
  .milestone-content {
    background: white;
    border: 1px solid var(--cloud);
    border-radius: 8px;
    padding: 20px 24px;
    flex: 1;
    margin-left: 16px;
  }
  .milestone-num {
    font-family: 'Space Mono', monospace;
    font-size: 10px; color: var(--sage);
    letter-spacing: 0.1em; margin-bottom: 6px;
  }
  .milestone-title { font-weight: 600; font-size: 15px; color: var(--forest); margin-bottom: 6px; }
  .milestone-date {
    font-family: 'Space Mono', monospace;
    font-size: 12px; color: var(--amber);
    background: #FEF3C7; padding: 3px 10px;
    border-radius: 3px; display: inline-block;
  }
  .milestone-delivs {
    font-size: 12px; color: var(--silver);
    margin-top: 8px;
  }

  /* ── DATA SOURCES ── */
  .sources-section-bg {
    background: var(--forest);
    padding: 80px 64px;
  }
  .sources-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 20px; margin-top: 40px;
    max-width: 1400px; margin-left: auto; margin-right: auto;
  }
  .source-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(149,213,178,0.15);
    border-radius: 8px;
    padding: 24px;
  }
  .source-category {
    font-family: 'Space Mono', monospace;
    font-size: 10px; color: var(--moss);
    text-transform: uppercase; letter-spacing: 0.15em;
    margin-bottom: 12px;
  }
  .source-card-title {
    font-size: 15px; font-weight: 600; color: white;
    margin-bottom: 4px;
  }
  .source-card-provider {
    font-size: 12px; color: rgba(149,213,178,0.6);
    margin-bottom: 12px;
  }
  .source-card-desc { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.6; }

  /* ── DISTRICT DETAIL MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    padding: 20px;
  }
  .modal {
    background: white; border-radius: 12px;
    max-width: 560px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,0.3);
  }
  .modal-header {
    background: var(--forest);
    padding: 28px 32px; border-radius: 12px 12px 0 0;
  }
  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px; color: white;
  }
  .modal-hq { font-size: 13px; color: var(--mist); margin-top: 4px; }
  .modal-body { padding: 28px 32px; }
  .modal-close {
    float: right; background: rgba(255,255,255,0.1);
    border: none; color: white; width: 32px; height: 32px;
    border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .modal-attr { }
  .modal-attr-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--silver);
    margin-bottom: 4px;
  }
  .modal-attr-value { font-size: 14px; font-weight: 600; color: var(--forest); }
  .modal-blocks { margin-top: 20px; }
  .block-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .block-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--fog); padding: 10px 14px; border-radius: 4px;
    font-size: 13px;
  }
  .block-rank {
    font-family: 'Space Mono', monospace;
    font-size: 10px; color: var(--sage);
    background: white; width: 24px; height: 24px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }

  /* ── CHART SECTION ── */
  .charts-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 24px; margin-top: 40px;
  }
  .chart-card {
    background: white; border: 1px solid var(--cloud);
    border-radius: 8px; padding: 24px;
  }
  .chart-title {
    font-size: 14px; font-weight: 600; color: var(--forest);
    margin-bottom: 4px;
  }
  .chart-subtitle { font-size: 12px; color: var(--silver); margin-bottom: 20px; }

  /* ── FOOTER ── */
  footer {
    background: var(--stone);
    padding: 48px 64px;
    color: rgba(255,255,255,0.4);
  }
  .footer-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 40px; max-width: 1400px; margin: 0 auto;
  }
  .footer-brand {
    font-family: 'DM Serif Display', serif;
    font-size: 22px; color: white; margin-bottom: 8px;
  }
  .footer-legal { font-size: 11px; line-height: 1.6; margin-top: 8px; }
  .footer-section-title { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .footer-link { display: block; font-size: 12px; color: rgba(255,255,255,0.35); margin-bottom: 6px; text-decoration: none; }
  .footer-link:hover { color: rgba(255,255,255,0.7); }
  .footer-bottom {
    margin-top: 40px; padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px; text-align: center;
    max-width: 1400px; margin-left: auto; margin-right: auto;
  }

  /* Utility */
  .divider {
    height: 1px; background: var(--cloud);
    margin: 0;
  }
  .text-center { text-align: center; }
  @media (max-width: 900px) {
    .hero-content { padding: 60px 24px 40px; }
    .section { padding: 60px 24px; }
    .hero-stats { grid-template-columns: repeat(2,1fr); }
    .map-grid { grid-template-columns: 1fr; }
    .map-sidebar { max-height: 260px; }
    .crops-grid { grid-template-columns: 1fr; }
    .charts-grid { grid-template-columns: 1fr; }
    .sources-grid { grid-template-columns: 1fr; }
    .footer-grid { grid-template-columns: 1fr; }
    .nav-links { display: none; }
    .map-container-outer { padding: 40px 24px; }
    .sources-section-bg { padding: 60px 24px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useRef } = React;
const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar, Cell, PieChart, Pie, Legend } = Recharts;

// ── COLOUR HELPERS ─────────────────────────────────────────────────────────
function suitabilityColor(s) {
  if (s === 'High') return '#059669';
  if (s === 'Medium') return '#D97706';
  return '#DC2626';
}
function scoreGradient(score) {
  if (score >= 75) return 'linear-gradient(90deg,#059669,#34D399)';
  if (score >= 55) return 'linear-gradient(90deg,#D97706,#FCD34D)';
  return 'linear-gradient(90deg,#DC2626,#F87171)';
}

// ── SUITABILITY MAP ─────────────────────────────────────────────────────────
function SuitabilityMap({ activeLayer }) {
  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const markersRef = useRef([]);
  const [selected, setSelected] = useState(null);

  useEffect(() => {
    if (mapInstance.current) return;
    const map = L.map('suitability-map', {
      center: [25.45, 91.36],
      zoom: 8,
      zoomControl: true
    });

    // OSM base layer
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap Contributors',
      maxZoom: 18
    });

    // Satellite layer (ESRI)
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Imagery © ESRI',
      maxZoom: 18
    });

    // Topo layer
    const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenTopoMap contributors',
      maxZoom: 17
    });

    osm.addTo(map);
    L.control.layers(
      { "Street Map": osm, "Satellite": satellite, "Topographic": topo },
      {},
      { position: 'topright' }
    ).addTo(map);

    mapInstance.current = map;
    mapRef.current = map;
  }, []);

  useEffect(() => {
    if (!mapInstance.current) return;
    const map = mapInstance.current;

    // Clear old markers
    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];

    DISTRICTS.forEach(d => {
      const col = suitabilityColor(d.buckwheat);
      const radius = 12 + (d.score / 10);
      const circle = L.circleMarker([d.lat, d.lng], {
        radius,
        fillColor: col,
        color: 'white',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.85
      });

      const wineCrops = d.wine.join(', ');
      circle.bindPopup(`
        <div style="font-family:'Inter',sans-serif;min-width:220px">
          <div style="background:#1B4332;color:white;padding:12px 14px;margin:-14px -14px 10px;border-radius:4px 4px 0 0">
            <div style="font-weight:700;font-size:14px">${d.name}</div>
            <div style="font-size:11px;opacity:0.7">HQ: ${d.hq}</div>
          </div>
          <div style="padding:0 2px">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <span style="font-size:11px;color:#6B7280">Buckwheat Suitability</span>
              <span style="font-size:11px;font-weight:700;color:${col}">${d.buckwheat}</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <span style="font-size:11px;color:#6B7280">Suitability Score</span>
              <span style="font-size:11px;font-weight:700;color:#1B4332">${d.score}/100</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <span style="font-size:11px;color:#6B7280">Elevation Range</span>
              <span style="font-size:11px;color:#374151">${d.elev}</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <span style="font-size:11px;color:#6B7280">Avg Rainfall</span>
              <span style="font-size:11px;color:#374151">${d.rain.toLocaleString()}mm/yr</span>
            </div>
            <div style="margin-top:8px;padding-top:8px;border-top:1px solid #E5E7EB">
              <span style="font-size:10px;color:#6B7280;text-transform:uppercase;letter-spacing:0.05em">Wine Crops</span>
              <div style="margin-top:4px;font-size:12px;color:#2D6A4F;font-weight:500">${wineCrops}</div>
            </div>
            <div style="margin-top:8px;padding-top:8px;border-top:1px solid #E5E7EB">
              <span style="font-size:10px;color:#6B7280;text-transform:uppercase;letter-spacing:0.05em">Top Priority Block</span>
              <div style="margin-top:4px;font-size:12px;color:#374151">${d.blocks[0]}</div>
            </div>
          </div>
        </div>
      `, { maxWidth: 260 });

      circle.addTo(map);
      markersRef.current.push(circle);
    });

    // Add legend
    const oldLegend = document.getElementById('map-legend-ctrl');
    if (oldLegend) oldLegend.remove();
    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = () => {
      const div = L.DomUtil.create('div');
      div.id = 'map-legend-ctrl';
      div.style.cssText = 'background:white;padding:12px 16px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.15);font-family:Inter,sans-serif;font-size:12px;min-width:160px';
      div.innerHTML = `
        <div style="font-weight:700;color:#1B4332;margin-bottom:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.08em">Buckwheat Suitability</div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:14px;height:14px;border-radius:50%;background:#059669;display:inline-block"></span><span>High (Score ≥ 75)</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:14px;height:14px;border-radius:50%;background:#D97706;display:inline-block"></span><span>Medium (Score 50–74)</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:50%;background:#DC2626;display:inline-block"></span><span>Low (Score < 50)</span></div>

      `;
      return div;
    };
    legend.addTo(map);
    markersRef.current.push({ remove: () => legend.remove() });

  }, [activeLayer]);

  return React.createElement('div', { id: 'suitability-map', className: 'leaflet-map' });
}

// ── WINE FRUIT MAP ─────────────────────────────────────────────────────────
function WineFruitMap() {
  useEffect(() => {
    if (document.getElementById('wine-map')._leaflet_id) return;
    const map = L.map('wine-map', { center:[25.45,91.36], zoom:8 });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'© OpenStreetMap Contributors'
    }).addTo(map);

    const CROP_COLORS = { Plum:'#7C3AED', Peach:'#EA580C', 'Passion Fruit':'#0891B2' };
    const cropGroups = {};
    Object.keys(CROP_COLORS).forEach(c => { cropGroups[c] = L.layerGroup().addTo(map); });

    DISTRICTS.forEach(d => {
      d.wine.forEach((crop, i) => {
        const col = CROP_COLORS[crop] || '#6B7280';
        const offset = i * 0.04;
        L.circleMarker([d.lat + offset, d.lng + offset], {
          radius: 9,
          fillColor: col,
          color:'white', weight:2,
          fillOpacity:0.85
        }).bindTooltip(`<b>${d.name}</b><br>${crop}`)
          .addTo(cropGroups[crop]);
      });
    });

    L.control.layers({}, cropGroups, { collapsed:false, position:'topright' }).addTo(map);

    const legend = L.control({ position:'bottomleft' });
    legend.onAdd = () => {
      const div = L.DomUtil.create('div');
      div.style.cssText = 'background:white;padding:12px 16px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.15);font-family:Inter,sans-serif;font-size:12px';
      div.innerHTML = `
        <div style="font-weight:700;color:#1B4332;margin-bottom:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.08em">Wine Fruit Crops</div>
        ${Object.entries(CROP_COLORS).map(([c,col]) =>
          `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="width:12px;height:12px;border-radius:50%;background:${col};display:inline-block"></span>
            <span>${c}</span>
          </div>`).join('')}
        <div style="margin-top:8px;font-size:10px;color:#9CA3AF">Use layers control → to toggle crops</div>
      `;
      return div;
    };
    legend.addTo(map);
  }, []);
  return React.createElement('div', { id:'wine-map', className:'leaflet-map' });
}

// ── RAINFALL MAP ──────────────────────────────────────────────────────────
function RainfallMap() {
  useEffect(() => {
    if (document.getElementById('rainfall-map')._leaflet_id) return;
    const map = L.map('rainfall-map', { center:[25.45,91.36], zoom:8 });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'© OpenStreetMap Contributors', opacity:0.5
    }).addTo(map);

    DISTRICTS.forEach(d => {
      const maxRain = 12000; const minRain = 2500;
      const ratio = (d.rain - minRain) / (maxRain - minRain);
      const r = Math.round(27 + (1-ratio)*200);
      const g = Math.round(67 + ratio*140);
      const b = Math.round(50 + (1-ratio)*50);
      const col = `rgb(${r},${g},${b})`;
      const radius = 14 + ratio * 22;

      L.circleMarker([d.lat, d.lng], {
        radius, fillColor:col, color:'white', weight:2, fillOpacity:0.85
      }).bindPopup(`
        <div style="font-family:Inter,sans-serif;padding:4px">
          <b style="color:#1B4332">${d.name}</b><br>
          <span style="font-size:13px">Annual Rainfall: <b>${d.rain.toLocaleString()} mm</b></span><br>
          <span style="font-size:11px;color:#6B7280">Data Source: IMD + WorldClim v2.1</span>
        </div>
      `).addTo(map);
    });

    const legend = L.control({ position:'bottomleft' });
    legend.onAdd = () => {
      const div = L.DomUtil.create('div');
      div.style.cssText = 'background:white;padding:12px 16px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.15);font-family:Inter,sans-serif;font-size:12px;min-width:180px';
      div.innerHTML = `
        <div style="font-weight:700;color:#1B4332;margin-bottom:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.08em">Annual Rainfall (mm/yr)</div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:16px;height:16px;border-radius:50%;background:#1B8732;display:inline-block"></span><span>> 8000 mm — Very High</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:12px;height:12px;border-radius:50%;background:#52B788;display:inline-block"></span><span>4000–8000 mm — High</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:10px;height:10px;border-radius:50%;background:#95D5B2;display:inline-block"></span><span>2500–4000 mm — Moderate</span></div>
        <div style="margin-top:8px;font-size:10px;color:#9CA3AF">Source: IMD Gridded Data + WorldClim v2.1<br>Circle size ∝ rainfall volume</div>
      `;
      return div;
    };
    legend.addTo(map);
  }, []);
  return React.createElement('div', { id:'rainfall-map', className:'leaflet-map' });
}

      { name:"E. Garo Hills", lat:25.5949, lng:90.6578, min:200, max:800, peak:"Tura Range (East)" },
      { name:"W. Garo Hills", lat:25.5155, lng:90.2134, min:100, max:600, peak:"Tura Peak" },
      { name:"S. Garo Hills", lat:25.1969, lng:90.6353, min:100, max:900, peak:"Simsang Valley" }
    ];

    elevData.forEach(d => {
      const avgElev = (d.min + d.max) / 2;
      const ratio = (avgElev - 100) / (1900 - 100);
      const col = `hsl(${140 + ratio*20},${50+ratio*30}%,${55-ratio*25}%)`;

      L.circleMarker([d.lat, d.lng], {
        radius: 10 + ratio*16,
        fillColor: col, color:'white', weight:2, fillOpacity:0.85
      }).bindPopup(`
        <div style="font-family:Inter,sans-serif;padding:4px">
          <b style="color:#1B4332;font-size:14px">${d.name}</b><br>
          <div style="margin-top:6px">
            <span style="font-size:12px">Elevation Range: <b>${d.min}–${d.max}m</b></span><br>
            <span style="font-size:11px;color:#6B7280">Notable: ${d.peak}</span><br>
            <span style="font-size:10px;color:#9CA3AF">Source: NASA SRTM DEM 30m</span>
          </div>
        </div>
      `).addTo(map);
    });
    const legend = L.control({ position:'bottomleft' });
    legend.onAdd = () => {
      const div = L.DomUtil.create('div');
      div.style.cssText = 'background:white;padding:12px 16px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.15);font-family:Inter,sans-serif;font-size:12px';
      div.innerHTML = `
        <div style="font-weight:700;color:#1B4332;margin-bottom:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.08em">Elevation Range (m)</div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span style="width:16px;height:16px;border-radius:50%;background:#2D6A4F;display:inline-block"></span><span>> 1500m — Alpine</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span style="width:13px;height:13px;border-radius:50%;background:#52B788;display:inline-block"></span><span>800–1500m — Highland</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:#95D5B2;display:inline-block"></span><span>< 800m — Foothill</span></div>
        <div style="margin-top:8px;font-size:10px;color:#9CA3AF">Source: NASA SRTM DEM 30m<br>Topographic base: OpenTopoMap</div>
      `;
      return div;
    };
    legend.addTo(map);
  }, []);
  return React.createElement('div', { id:'elev-map', className:'leaflet-map' });
}
